{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-success text-white p-4 rounded-top-4">
                    <h3 class="fw-bold mb-1"><i class="bi bi-newspaper me-2"></i>Publish Chairman's Activity</h3>
                    <p class="mb-0 text-white-50 small">Media Aide Portal — Upload daily news and press releases</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">Headline / Title</label>
                            <input type="text" class="form-control" id="title" name="title" required placeholder="e.g., Agatu Chairman Inspects New Water Project">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label fw-bold">Category</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="Executive Brief">Executive Brief</option>
                                    <option value="Disaster Relief & Public Safety">Disaster Relief & Public Safety</option>
                                    <option value="Infrastructure & Projects">Infrastructure & Projects</option>
                                    <option value="Community Engagement">Community Engagement</option>
                                    <option value="Press Release">Press Release</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="author" class="form-label fw-bold">Author / Office</label>
                                <input type="text" class="form-control" id="author" name="author" value="Agatu LGA Media Office" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="image" class="form-label fw-bold">Activity Photo</label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
                            <div class="form-text">Upload a clear action picture of the event.</div>
                        </div>

                        <div class="mb-3">
                            <label for="summary" class="form-label fw-bold">Short Summary (Excerpt)</label>
                            <textarea class="form-control" id="summary" name="summary" rows="2" required placeholder="Brief introductory summary for homepage and card previews..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="content" class="form-label fw-bold">Full Article Content (HTML supported)</label>
                            <textarea class="form-control" id="content" name="content" rows="6" required placeholder="<p>Full details of the executive activity...</p>"></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary fw-semibold">
                                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                            </a>
                            <button type="submit" class="btn btn-success fw-bold px-4">
                                <i class="bi bi-cloud-upload-fill me-1"></i> Publish Post Now
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
