{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="mb-4 text-center">
                    <span class="badge bg-success bg-opacity-10 text-success fw-bold px-3 py-1 mb-2">Executive Admin</span>
                    <h2 class="fw-bold text-dark">Publish New Press Release</h2>
                    <p class="text-muted small">Upload field images and broadcast official announcements directly to the Agatu LGA portal.</p>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold text-dark">Headline Title</label>
                        <input type="text" class="form-control rounded-3" id="title" name="title" placeholder="e.g., Agatu Chairman Flags Off New Health Centre" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="category" class="form-label fw-bold text-dark">Category</label>
                            <select class="form-select rounded-3" id="category" name="category" required>
                                <option value="Executive Brief">Executive Brief</option>
                                <option value="Disaster Relief & Public Safety">Disaster Relief & Public Safety</option>
                                <option value="Infrastructure & Projects">Infrastructure & Projects</option>
                                <option value="Community Engagement">Community Engagement</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="author" class="form-label fw-bold text-dark">Author / Office</label>
                            <input type="text" class="form-control rounded-3" id="author" name="author" value="Agatu LGA Media Office" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="summary" class="form-label fw-bold text-dark">Short Summary</label>
                        <textarea class="form-control rounded-3" id="summary" name="summary" rows="2" placeholder="Brief overview for news cards..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label fw-bold text-dark">Full Article HTML Content</label>
                        <textarea class="form-control rounded-3" id="content" name="content" rows="5" placeholder="&lt;p&gt;Paragraph text here...&lt;/p&gt;" required></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="image_file" class="form-label fw-bold text-dark">Cover Photo (Saved automatically to static/images/)</label>
                        <input type="file" class="form-control rounded-3" id="image_file" name="image_file" accept="image/*">
                        <div class="form-text text-muted">Select a JPG or PNG file from your device.</div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('news_list') }}" class="text-secondary text-decoration-none fw-semibold">Cancel</a>
                        <button type="submit" class="btn btn-success px-4 py-2 rounded-pill fw-bold shadow-sm">
                            <i class="bi bi-cloud-arrow-up-fill me-1"></i> Publish Broadcast
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
